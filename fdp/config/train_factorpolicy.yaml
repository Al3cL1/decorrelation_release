defaults:
  - _self_
  - task: libero/atomics25

name: train_factorpolicy
_target_: fdp.workspace.train_policy.TrainPolicyWorkspace

seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
task_name: ${task.name}
shape_meta: ${task.shape_meta}

policy:
  _target_: fdp.policy.factorpolicy.FactorizedDiffusionTransformerPolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  obs_encoder:
    _target_: fdp.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}

    vision_encoder:
      _target_: fdp.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [76, 76]
    
    state_encoder:
      _target_: fdp.perception.state_encoder.ProjectionStateEncoder
      out_dim: null   # identity projection

  # factorized policy params
  num_experts: 4
  embed_dim: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  use_state_dependent_weighting: false
  use_time_dependent_weighting: false
  entropy_coef: 0.0
  expert_dropout: 0.2
  unitize_experts: false
  # softmax_weights and affine_weights are mutually exclusive; both false = FDP's raw router
  softmax_weights: false
  affine_weights: true    # affine router: w = logits - mean + 1/K (signed, sums to 1)
  ortho_coef: 0.003       # lambda of the decorrelation loss; 0.0 disables it
  ortho_mode: flat_cos2_envelope   # the paper's loss; alternatives in factorpolicy._ortho_loss

  # DDIM
  num_inference_steps: 10
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100  # train with 100 steps, inferece with 10 steps
    beta_start: 0.0001
    beta_end: 0.02
    # beta_schedule is important
    # this is the best we found
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon


training:
  resume: True
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 1001
  val_every: 10
  # sample_every aligned to checkpoint_every so test_reconst_mse (the topk
  # monitor key) is present in step_log at every checkpoint epoch.
  sample_every: 25
  rollout_every: 200
  checkpoint_every: 25
  lr_scheduler: constant
  lr_warmup_steps: 200
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: True
  num_demo: 5000
  tqdm_interval_sec: 1.0

ema:
  _target_: fdp.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  
dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

logging:
  project: fdp_decorrelation
  resume: True
  mode: offline   # no wandb login needed; `wandb sync` later, or logging.mode=online / disabled
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ["${name}", "${task_name}"]
  id: null
  group: null

checkpoint:
  topk:
    # in-train rollouts are off (lazy_eval), so select on validation reconstruction MSE
    monitor_key: test_reconst_mse
    mode: min
    k: 3
    format_str: 'ep-{epoch:04d}_mse-{test_reconst_mse:.5f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
