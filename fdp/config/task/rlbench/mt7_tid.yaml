name: rb-mt7-tid

task_name: rb-mt7-tid
lazy_eval: true

# mt7 with task_id as a state input (mt7_N350_tid.zarr, from gen_data.py).

shape_meta: &shape_meta
  obs:
    front_rgb:
      shape: [128, 128, 3]
      type: rgb
    wrist_rgb:
      shape: [128, 128, 3]
      type: rgb
    overhead_rgb:
      shape: [128, 128, 3]
      type: rgb
    joint_positions:
      shape: [7]
      type: state
    gripper_joint_positions:
      shape: [2]
      type: state
    task_id:
      shape: [1]
      type: state
  action:
    shape: [9]


env_runner:
  _target_: fdp.env_runner.rlbench_runner.RlbenchRunner
  task_name: mt7
  n_test: 175        # 25 episodes x 7 tasks
  n_test_vis: 7
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  fps: 10
  n_parallel_envs: 35 # must be a multiple of the task count (env i is pinned to task i % 7)
  image_size: 128
  camera_names: ['front', 'wrist', 'overhead']
  state_ports:
    - joint_positions
    - gripper_joint_positions
  max_episode_steps: 250


dataset:
  _target_: fdp.dataset.zarr_dataset.ZarrDataset
  zarr_path: ${oc.env:DATA_ROOT}/rlbench/mt7_N350_tid.zarr
  obs_keys:
    - front_rgb
    - wrist_rgb
    - overhead_rgb
    - joint_positions
    - gripper_joint_positions
    - task_id
  action_key: joint_action
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${horizon}
  seed: ${seed}
  val_ratio: 0.1
