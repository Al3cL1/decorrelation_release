# decorr env: RLBench and RoboCasa (LIBERO needs robosuite 1.4.0: environment-libero.yml).
#
# Install CoppeliaSim 4.1.0 first; PyRep builds against it during `conda env create`
# (needs glibc >= 2.29; to re-create the env, delete $COPPELIASIM_ROOT/libcoppeliaSim.so.1 first):
#   export COPPELIASIM_ROOT=$HOME/.coppeliasim
#   export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COPPELIASIM_ROOT QT_QPA_PLATFORM_PLUGIN_PATH=$COPPELIASIM_ROOT
#   wget https://downloads.coppeliarobotics.com/V4_1_0/CoppeliaSim_Edu_V4_1_0_Ubuntu20_04.tar.xz
#   mkdir -p $COPPELIASIM_ROOT && tar -xf CoppeliaSim_Edu_V4_1_0_Ubuntu20_04.tar.xz -C $COPPELIASIM_ROOT --strip-components 1
#
#   conda env create -f environment.yml && conda activate decorr
#   pip install --no-deps "robocasa @ git+https://github.com/robocasa/robocasa@56e355ccc64389dfc1b8a61a33b9127b975ba681" lerobot==0.3.3   # lerobot declares torch<2.8
#   pip install tianshou==0.4.10 pygame hidapi pynput datasets==3.6.0 jsonlines torchcodec==0.7.0
#   pip install -e .
#   python -m robocasa.scripts.download_kitchen_assets && python -m robocasa.scripts.setup_macros
name: decorr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - cmake<4      # egl_probe (a robomimic dependency) builds from source; CMake 4 rejects it
  - ffmpeg=7.1
  - libegl
  - libgl
  - libglvnd
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - torchvision==0.23.0
      # core
      - accelerate==1.13.0
      - diffusers==0.38.0
      - transformers==5.7.0
      - huggingface_hub==1.13.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - zarr==3.1.6
      - numcodecs==0.16.5
      - numpy==2.2.5
      - numba==0.61.2
      - einops==0.8.2
      - dill==0.3.8
      - click==8.3.3
      - wandb==0.26.1
      - gymnasium==1.3.0
      - gym==0.26.2
      - robomimic==0.2.0
      - tensorboard==2.20.0
      # sim / rendering
      - mujoco==3.3.1
      - PyOpenGL==3.1.10
      - glfw==2.10.0
      - av==17.0.1
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - opencv-python==4.13.0.92
      - h5py==3.16.0
      - pyquaternion==0.9.9
      - lxml==6.1.0
      # analysis / plotting
      - scipy==1.15.3
      - scikit-learn==1.8.0
      - matplotlib==3.10.9
      - pandas==3.0.2
      - pillow==12.2.0
      - tqdm==4.67.3
      - PyYAML==6.0.3
      - termcolor==3.3.0
      - natsort==8.4.0
      # simulators, pinned to the exact commits the runs used
      - robosuite @ git+https://github.com/ARISE-Initiative/robosuite@aaa8b9b214ce8e77e82926d677b4d61d55e577ab
      - rlbench @ git+https://github.com/Chaoqi-LIU/RLBench.git@b80e51feb3694d9959cb8c0408cd385001b01382
      # robocasa is installed after creation, without deps (see the header).
      # PyRep comes in through rlbench (github.com/stepjam/PyRep, unpinned), built against $COPPELIASIM_ROOT.
