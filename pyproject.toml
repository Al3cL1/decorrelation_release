[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorized-diffusion-policy"
version = "0.1.0"
description = "FDP fork with the score-decorrelation loss (Learning to be Different). Simulator stacks are installed from environment*.yml, not from here."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "accelerate>=1.13.0",
    "diffusers>=0.38.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "zarr>=3.1.6",
    "numcodecs",
    "numpy>=2.2",
    "numba",
    "einops",
    "dill",
    "click",
    "tqdm",
    "Pillow",
    "pandas",
    "scipy",
    "matplotlib",
    "wandb",
    "gymnasium>=1.3.0",
    "robomimic==0.2.0",
    "av",
    "imageio",
    "opencv-python",
]

[tool.hatch.build.targets.wheel]
packages = ["fdp"]
